{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Login - Mini EHR</title>

    <link rel="stylesheet"
          href="{% static 'Patients/login.css' %}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>🏥 Mini EHR</h1>

            <p>Login to continue</p>


            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >


                {% if messages %}

                    {% for message in messages %}

                        <div class="error-message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}


                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>
</html>
